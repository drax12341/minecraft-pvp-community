<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090d19" />
    <title>Find your way back | Mace Network</title>
    <link
      rel="canonical"
      href="https://drax12341.github.io/minecraft-pvp-community/"
    />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #090d19;
        color: #e5edf5;
        font: 16px/1.8 system-ui;
      }
      main {
        padding: 30px;
        max-width: 470px;
      }
      h1 {
        font-size: 44px;
        line-height: 1.1;
        letter-spacing: -2px;
      }
      p {
        color: #9caec3;
      }
      a {
        color: #b8dff7;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Mace Network</p>
      <h1>Find your next good fight.</h1>
      <p>This page has moved or doesn’t exist.</p>
      <a href="/minecraft-pvp-community/">Back to the community</a>
    </main>
    <script>
      const base = "/minecraft-pvp-community/";
      const routes = {
        rankings: "rankings",
        leaderboards: "rankings",
        queues: "testing",
        tests: "results",
        testers: "test-desk",
        modes: "kits",
        points: "planner",
        rules: "about",
        faq: "test-desk",
        support: "community",
        "how-to-test": "test-desk",
        mod: "tagger",
        "hall-of-fame": "high-tiers",
      };
      const path = location.pathname.startsWith(base)
        ? location.pathname.slice(base.length).replace(/\/$/, "")
        : "";
      const route = routes[path];
      if (route) location.replace(base + "#" + route + location.search);
      else if (/^players\/[a-f0-9-]{32,36}$/i.test(path))
        location.replace(
          base + "#rankings?player=" + encodeURIComponent(path.slice(8)),
        );
    </script>
  </body>
</html>
